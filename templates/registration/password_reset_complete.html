{% extends 'base.html' %}

{% block title %}Password Reset Complete - House Expense{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        width: 100%;
        height: 100vh;
        margin-top: -40px; /* Offset the container padding to truly center */
    }

    .auth-card {
        width: 100%;
        max-width: 400px;
        padding: 40px;
        text-align: center;
        background: var(--bg-card);
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        animation: fadeIn 0.6s ease-out;
    }

    .auth-header {
        margin-bottom: 30px;
    }

    .auth-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--primary-color);
    }

    .auth-subtitle {
        color: var(--text-muted);
        font-size: 1.05rem;
        line-height: 1.5;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .icon-success {
        color: var(--success-color, #2ecc71);
        font-size: 3rem;
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel">
        <div class="icon-success">
            <i class="fas fa-check-circle"></i>
        </div>
        <div class="auth-header">
            <h1 class="auth-title">Password Reset Complete</h1>
            <p class="auth-subtitle">Your password has been set. You may go ahead and log in now.</p>
        </div>
        
        <a href="{% url 'login' %}" class="btn-primary" style="display: block; width: 100%; padding: 10px; font-weight: 500; text-decoration: none;">Log in</a>
    </div>
</div>
{% endblock %}
