{% extends 'base.html' %}

{% block title %}Sign Up - House Expense{% endblock %}

{% block extra_css %}
<style>
    .auth-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        width: 100%;
        min-height: calc(100vh - 40px);
        margin-top: 20px;
        margin-bottom: 20px;
    }

    .auth-card {
        width: 100%;
        max-width: 100%;
        padding: 40px;
        text-align: center;
        animation: fadeIn 0.6s ease-out;
    }

    .auth-header {
        margin-bottom: 30px;
    }

    .auth-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
        color: var(--text-muted);
        font-size: 0.95rem;
    }

    .auth-form {
        text-align: left;
    }

    .auth-form p {
        margin-bottom: 20px;
    }

    .auth-form label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    .auth-form input[type="text"],
    .auth-form input[type="password"],
    .auth-form input[type="email"] {
        width: 100%;
        padding: 12px 16px;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-main);
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
    }

    .auth-form input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    .helptext {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 5px;
        display: block;
    }
    
    .errorlist {
        color: var(--error-color);
        font-size: 0.8rem;
        list-style-type: none;
        margin-top: 5px;
        padding-left: 0;
    }

    .signup-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 0.9rem;
        color: var(--text-muted);
    }

    .signup-link a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.3s;
    }

    .signup-link a:hover {
        color: var(--primary-hover);
        text-decoration: underline;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel">
        <div class="auth-header">
            <h1 class="auth-title">Create an Account</h1>
            <p class="auth-subtitle">Join us to manage your expenses effectively</p>
        </div>

        <form method="post" action="{% url 'signup' %}" class="auth-form">
            {% csrf_token %}
            
            {{ form.as_p }}

            <button type="submit" class="btn-primary" style="margin-top: 10px;">Sign Up</button>
        </form>
        
        <div class="signup-link">
            Already have an account? <a href="{% url 'login' %}">Sign in here</a>
        </div>
    </div>
</div>
{% endblock %}
