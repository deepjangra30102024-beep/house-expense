{% extends 'base.html' %}

{% block title %}Report - House Expense{% endblock %}

{% block extra_css %}
<style>
    .settings-card {
        border: none;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        margin-bottom: 24px;
        overflow: hidden;
        animation: fadeIn 0.4s ease-out;
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    .card-body {
        padding: 30px 40px;
    }

    .card-title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 30px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 15px;
    }
    
    .card-title svg {
        color: var(--primary-color);
        background: rgba(98, 110, 212, 0.1);
        padding: 8px;
        border-radius: 8px;
        width: 40px;
        height: 40px;
    }
    
    .form-group-row {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 20px;
        border-bottom: 1px dashed var(--border-color);
        transition: all 0.3s ease;
    }
    
    .form-group-row:last-of-type {
        border-bottom: none;
        padding-bottom: 0;
    }
    
    .form-group-row:hover {
        background: rgba(98, 110, 212, 0.02);
        border-radius: 8px;
        padding-left: 15px;
        padding-right: 15px;
        margin-left: -15px;
        margin-right: -15px;
    }

    .col-form-label {
        width: 30%;
        color: var(--text-main);
        font-weight: 500;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .col-input {
        width: 70%;
    }

    .django-form input[type="text"],
    .django-form input[type="email"],
    .django-form input[type="number"],
    .django-form input[type="date"],
    .django-form select,
    .django-form textarea {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #dce1e7;
        border-radius: 8px;
        font-size: 14px;
        color: #495057;
        background-color: #fcfcfc;
        transition: all 0.25s ease;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
    }

    .django-form input:focus,
    .django-form select:focus,
    .django-form textarea:focus {
        border-color: var(--primary-color);
        background-color: #fff;
        outline: 0;
        box-shadow: 0 0 0 4px rgba(98, 110, 212, 0.15);
    }
    
    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 35px;
        padding-top: 25px;
        border-top: 1px solid var(--border-color);
    }
    
    .btn-pdf {
        background: linear-gradient(135deg, #ec536c 0%, #c83d54 100%);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(236, 83, 108, 0.25);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .btn-pdf:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(236, 83, 108, 0.4);
    }
    
    .btn-excel {
        background: linear-gradient(135deg, #02a499 0%, #018279 100%);
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-weight: 500;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 10px rgba(2, 164, 153, 0.25);
        display: flex;
        align-items: center;
        gap: 8px;
    }
    
    .btn-excel:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(2, 164, 153, 0.4);
    }

    @media (max-width: 768px) {
        .form-group-row {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .form-group-row:hover {
            transform: none;
        }
        
        .col-form-label {
            width: 100%;
            margin-bottom: 10px;
        }
        
        .col-input {
            width: 100%;
        }
        
        .card-body {
            padding: 20px;
        }
        
        .form-actions {
            flex-direction: column;
        }
        
        .btn-pdf, .btn-excel {
            width: 100%;
            justify-content: center;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="row">
    <div class="col-xl-8 offset-xl-2 col-md-10 offset-md-1">
        <div class="settings-card">
            <div class="card-body">
                <h4 class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Download Report
                </h4>
                
                <form method="get" class="django-form" id="reportForm">
                    <div class="form-group-row">
                        <label for="start_date" class="col-form-label">Start Date (Optional)</label>
                        <div class="col-input">
                            <input type="date" id="start_date" name="start_date" class="form-control">
                        </div>
                    </div>
                    
                    <div class="form-group-row">
                        <label for="end_date" class="col-form-label">End Date (Optional)</label>
                        <div class="col-input">
                            <input type="date" id="end_date" name="end_date" class="form-control">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" formaction="{% url 'export_pdf' %}" class="btn-pdf">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download PDF
                        </button>
                        <button type="submit" formaction="{% url 'export_excel' %}" class="btn-excel">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download Excel
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
